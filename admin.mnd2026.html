<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<meta name="robots" content="noindex,nofollow">
<title>MND | لوحة التحكم</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div id="tst"></div>
<script src="common.js"></script>
<script>
/* كلمة المرور محفوظة مشفّرة بخمس طبقات (عكس ← XOR ← إزاحة ← Base64 ← عكس وقلب الحروف) */
const PASS_E='=8NH+9xH5byF',_k=[77,78,68];
function enc5(s){let b=[...new TextEncoder().encode(s)].reverse();b=b.map((x,i)=>x^_k[i%3]);b=b.map((x,i)=>(x+(i%7)+3)&255);const t=btoa(String.fromCharCode(...b));return [...t].reverse().map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')}
function dec5(e){try{const t=[...e].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).reverse().join('');let b=[...atob(t)].map(c=>c.charCodeAt(0));b=b.map((x,i)=>(x-(i%7)-3+512)&255);b=b.map((x,i)=>x^_k[i%3]);return new TextDecoder().decode(new Uint8Array(b.reverse()))}catch(e){return null}}
const stc=x=>({'جديد':'#2563eb','قيد التجهيز':'#d97706','مكتمل':'#16a34a','ملغي':'#dc2626'}[x]||'#777');
const sp=x=>`<span class="pill" style="background:${stc(x)}22;color:${stc(x)}">${esc(x)}</span>`;
const oi=o=>o.items.map(i=>`${esc(i.n)} (${esc(i.s)}) ×${i.q}`).join('، ');
function adminView(){const s=D.settings,p=s.pay;
if(!authed)return `<div class="lg">${lg(110)}<p style="color:var(--mut);margin:6px 0 16px">لوحة التحكم</p><input class="inp" id="pw" type="password" placeholder="كلمة المرور"><button class="btn w" onclick="login()">دخول</button><p style="margin-top:8px"><a style="cursor:pointer;color:var(--mut)" onclick="location.href='index.html'">← العودة للمتجر</a></p></div>`;
const N=D.orders.filter(o=>o.st==='جديد').length;
const T=[['home','📊','الرئيسية'],['prods','👕','المنتجات'],['ords','📦','الطلبات'+(N?' ('+N+')':'')],['cus','👥','العملاء'],['set','⚙️','الإعدادات']];
const rev=D.orders.filter(o=>o.st!=='ملغي').reduce((a,o)=>a+o.total,0);
let c='';
if(tab==='home')c=`<h2 class="ph">نظرة عامة</h2><div class="st">${[['👕',D.products.length,'منتج','#7c3aed'],['📦',D.orders.length,'إجمالي الطلبات','#2563eb'],['🔔',N,'طلبات جديدة','#d97706'],['💰',usd(rev),'المبيعات','#16a34a']].map(x=>`<div class="sc"><i style="background:${x[3]}22;color:${x[3]}">${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
<div class="pn"><h3>أحدث الطلبات</h3>${D.orders.slice(0,5).map(o=>`<div class="row"><span>${esc(o.no||'')} · ${esc(o.name)}</span><span>${sp(o.st)} <b>${usd(o.total)}</b></span></div>`).join('')||'<p style="color:var(--mut)">لا توجد طلبات بعد.</p>'}</div>
<div class="pn"><h3>مخزون منخفض</h3>${D.products.filter(x=>x.stock<=5).map(x=>`<div class="row"><span>${esc(x.emoji)} ${esc(x.name)}</span><b>${x.stock}</b></div>`).join('')||'<p style="color:var(--mut)">لا يوجد.</p>'}</div>`;
if(tab==='prods')c=`<div class="ph2"><h2 class="ph">المنتجات</h2><button class="btn" onclick="editP(0)">+ منتج جديد</button></div>`+D.products.map(x=>{const k=x.stock<=0?'#dc2626':x.stock<=5?'#d97706':'#16a34a';return `<div class="li"><div class="pv" style="background:${esc(x.color)}">${pvIn(x)}</div><div class="g"><b>${esc(x.name)}</b><small>${esc(x.cat)} · ${usd(x.price)}${x.on?'':' · مخفي'}</small></div><span class="pill" style="background:${k}22;color:${k}">${x.stock<=0?'نفذ':x.stock+' متوفر'}</span><button class="mini" onclick="editP(${x.id})">تعديل</button></div>`}).join('');
if(tab==='ords')c=`<div class="ph2"><h2 class="ph">الطلبات</h2><button class="btn" onclick="exportXlsx()">⬇ تصدير الكل Excel</button></div><div class="chips" style="margin-bottom:12px">${['الكل',...sts].map(x=>`<button class="chip ${x===ofl?'on':''}" onclick="ofl='${x}';keep()">${x}${x==='الكل'?'':' ('+D.orders.filter(o=>o.st===x).length+')'}</button>`).join('')}</div>`+(D.orders.filter(o=>ofl==='الكل'||o.st===ofl).map(o=>`<div class="li" style="display:block"><div class="rw"><b>${esc(o.no||'')} · ${esc(o.name)}</b>${sp(o.st)}</div><small>${esc(o.date)} · ${esc(o.phone)} · جهاز <span dir="ltr">${esc(o.dev||'-')}</span></small><small>${esc(o.addr)}</small><p style="font-size:14px;margin:6px 0">${oi(o)}</p><div class="rw"><span style="font-size:14px">الدفع: ${esc(o.pay||'-')}${o.ref?' · عملية '+esc(o.ref):''}</span><b>${usd(o.total)}</b></div><div class="two" style="margin-top:8px;grid-template-columns:1fr 1fr auto"><select class="inp" style="margin:0" onchange="setSt(${o.id},this.value)">${sts.map(x=>`<option ${x===o.st?'selected':''}>${x}</option>`).join('')}</select><button class="btn o" onclick="inv=D.orders.find(x=>x.id===${o.id});keep()">الفاتورة</button><button class="btn r" onclick="delOrder(${o.id})" aria-label="حذف الطلب" style="padding:11px 14px">🗑</button></div></div>`).join('')||'<p style="color:var(--mut)">لا توجد طلبات.</p>')+(D.orders.some(o=>ofl==='الكل'||o.st===ofl)?'<button class="btn r w" style="margin-top:6px" onclick="delOrders()">🗑 حذف الطلبات المعروضة</button><p style="color:var(--mut);font-size:12px;text-align:center;margin-top:6px">يُنصح بتصدير Excel قبل الحذف.</p>':'');
if(tab==='cus')c=`<h2 class="ph">العملاء</h2>`+(D.customers.map(u=>{const L=D.orders.filter(o=>o.dev===u.dev);return `<div class="li" style="display:block"><div class="rw"><b>${esc(u.name)}</b><span class="pill" dir="ltr">${esc(u.dev)}</span></div><small>${esc(u.phone)} · ${esc(u.addr)}</small><small>${L.length} طلب · ${usd(L.filter(o=>o.st!=='ملغي').reduce((a,o)=>a+o.total,0))} · آخر طلب ${esc(u.last)}</small><p style="font-size:13px;margin-top:4px">${L.map(o=>esc(o.no)+' ('+esc(o.st)+')').join('، ')}</p></div>`}).join('')||'<p style="color:var(--mut)">لا يوجد عملاء بعد.</p>');
if(tab==='set')c=`<h2 class="ph">الإعدادات</h2>
<div class="pn"><h3>المتجر</h3><label>اسم المتجر</label><input class="inp" id="s1" value="${esc(s.name)}"><label>رقم واتساب (مثال: +963996368674)</label><input class="inp" id="s2" value="${esc(s.wa)}" dir="ltr"><label>عنوان الواجهة</label><input class="inp" id="s3" value="${esc(s.hero)}"><label>النص الفرعي</label><input class="inp" id="s4" value="${esc(s.sub)}"><label>نص «من نحن»</label><textarea class="inp" id="s9">${esc(s.about)}</textarea></div>
<div class="pn"><h3>الفروع (تظهر للزبائن في المتجر)</h3>${(s.branches||[]).map((b,i)=>`<div class="brw"><input class="inp" id="bn${i}" placeholder="اسم الفرع" value="${esc(b.n)}"><input class="inp" id="bp${i}" dir="ltr" placeholder="رقم واتساب +963..." value="${esc(b.p)}"><button class="mini" onclick="delBr(${i})" aria-label="حذف الفرع">🗑</button></div>`).join('')||'<p style="color:var(--mut)">لا توجد فروع بعد.</p>'}<button class="btn o w" style="margin-top:6px" onclick="addBr()">+ إضافة فرع</button></div>
<div class="pn"><h3>التواصل والموقع</h3><label>الموقع الرئيسي</label><input class="inp" id="s11" value="${esc(s.addr)}"><label>البريد الإلكتروني</label><input class="inp" id="s12" dir="ltr" value="${esc(s.email)}"><label>رابط فيسبوك</label><input class="inp" id="s13" dir="ltr" value="${esc(s.fb)}"><label>رابط انستغرام</label><input class="inp" id="s14" dir="ltr" value="${esc(s.ig)}"><label>رابط تيليغرام</label><input class="inp" id="s15" dir="ltr" value="${esc(s.tg)}"><label>رابط تيك توك</label><input class="inp" id="s16" dir="ltr" value="${esc(s.tt)}"><label>رابط يوتيوب</label><input class="inp" id="s17" dir="ltr" value="${esc(s.yt)}"><small style="color:var(--mut)">لا تظهر إلا الأيقونات التي تضع لها رابطاً (وواتساب من رقم المتجر).</small></div>
<div class="pn"><h3>الفاتورة</h3><label>رسوم التوصيل ($)</label><input class="inp" id="s6" type="number" step="0.01" value="${s.ship}"></div>
<div class="pn"><h3>أسعار الصرف (مقابل 1 دولار)</h3><div class="two"><div><label>الليرة السورية (ل.س)</label><input class="inp" id="s18" type="number" step="any" inputmode="decimal" value="${s.rSYP}"></div><div><label>الليرة التركية (₺)</label><input class="inp" id="s19" type="number" step="any" inputmode="decimal" value="${s.rTRY}"></div></div><small style="color:var(--mut)">تظهر الأسعار بالعملتين تحت سعر الدولار. ضع 0 لإخفاء عملة. عدّل السعر كلما تغيّر الصرف؛ الطلبات السابقة تحتفظ بسعر وقت الطلب.</small></div>
<div class="pn"><h3>طرق الدفع</h3><label class="sw"><input type="checkbox" ${p.sham.on?'checked':''} onchange="readS();D.settings.pay.sham.on=this.checked;save();keep()"> شام كاش (مسح QR)</label>
${p.sham.on?`<label style="margin-top:8px">رمز QR</label>${p.sham.qr?`<img class="qri" src="${p.sham.qr}" alt="QR">`:''}<input type="file" accept="image/*" class="inp" onchange="upQR(this)">${p.sham.qr?`<button class="mini" onclick="readS();D.settings.pay.sham.qr='';save();keep()">حذف الرمز</button>`:''}<label style="margin-top:8px">رقم الحساب (يظهر تحت الـ QR)</label><input class="inp" id="s8" dir="ltr" value="${esc(p.sham.acc)}" placeholder="رقم حساب شام كاش">`:''}
<label class="sw" style="margin-top:12px"><input type="checkbox" ${p.cod.on?'checked':''} onchange="readS();D.settings.pay.cod.on=this.checked;save();keep()"> الدفع عند الاستلام</label></div>
<div class="pn"><h3>النسخ الاحتياطي</h3><p style="color:var(--mut);font-size:13px;margin-bottom:8px">البيانات محفوظة في هذا المتصفح. حمّل نسخة كاملة (منتجات وصور وطلبات) من وقت لآخر.</p><div class="two"><button class="btn" onclick="backup()">⬇ تنزيل نسخة</button><label class="btn o" style="margin:0;text-align:center;cursor:pointer;font-size:16px;color:var(--ink)">استعادة نسخة<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label></div></div>
<div class="pn"><h3>الأمان</h3><label>تغيير كلمة المرور (اتركه فارغًا للإبقاء على الحالية)</label><input class="inp" id="s5" type="password" autocomplete="new-password" placeholder="كلمة مرور جديدة (6 أحرف على الأقل)"></div>
<button class="btn w" onclick="saveS()">حفظ الإعدادات</button><button class="btn o w" style="margin-top:10px" onclick="if(confirm('إعادة ضبط جميع البيانات؟ سيتم حذف كل شيء.')){D=structuredClone(seed);save();keep()}">إعادة ضبط البيانات</button>`;
return `<div class="ad"><div class="at"><b>🛍️ ${esc(s.name)} · لوحة التحكم</b><span><button class="mini" onclick="location.href='index.html'">المتجر ↗</button> <button class="mini" onclick="authed=false;keep()">خروج</button></span></div><div class="ac">${c}</div><nav class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';keep()"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav></div>${edit?prodForm():''}${invSheet()}`}
let _bad=0,_lock=0;
function login(){const now=Date.now();if(now<_lock){toast('محاولات كثيرة، انتظر '+Math.ceil((_lock-now)/1000)+' ثانية');return}
 if($('pw').value===dec5(D.settings.passE||PASS_E)){_bad=0;authed=true;keep()}
 else{if(++_bad>=5){_bad=0;_lock=now+30000;toast('محاولات كثيرة، انتظر 30 ثانية')}else toast('كلمة المرور غير صحيحة')}}
function setSt(id,v){D.orders.find(o=>o.id===id).st=v;save();toast('تم تحديث الحالة');keep()}
function readS(){if(!$('s1'))return;const s=D.settings;Object.assign(s,{name:$('s1').value||'MND',wa:$('s2').value,hero:$('s3').value,sub:$('s4').value,ship:+$('s6').value||0,tax:0});if($('s18')){s.rSYP=+$('s18').value||0;s.rTRY=+$('s19').value||0}if($('s8'))s.pay.sham.acc=$('s8').value;if($('s9')){s.about=$('s9').value;s.addr=$('s11').value;s.email=$('s12').value;s.fb=$('s13').value;s.ig=$('s14').value;s.tg=$('s15').value;s.tt=$('s16').value;s.yt=$('s17').value;(s.branches||[]).forEach((b,i)=>{if($('bn'+i)){b.n=$('bn'+i).value.trim();b.p=$('bp'+i).value.trim()}})}}
function saveS(){const np=$('s5')?$('s5').value:'';if(np&&np.length<6){toast('كلمة المرور 6 أحرف على الأقل');return}readS();if(np)D.settings.passE=enc5(np);D.settings.branches=(D.settings.branches||[]).filter(b=>b.n||b.p);save();toast('تم الحفظ');keep()}
function upQR(el){const f=el.files[0];if(!f)return;readS();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);D.settings.pay.sham.qr=c.toDataURL('image/png');save();toast('تم رفع رمز QR');keep()};im.src=r.result};r.readAsDataURL(f)}
function editP(id){edit=id?{...D.products.find(p=>p.id===id)}:{id:0,name:'',cat:'رجالي',price:0,stock:0,sizes:'S,M,L',emoji:'👕',color:'#e8e3da',on:true,imgs:[]};keep()}
function prodForm(){const p=edit;return `<div class="ov"><div class="sh"><h3>${p.id?'تعديل منتج':'منتج جديد'}</h3>
<label>الاسم</label><input class="inp" id="f1" value="${esc(p.name)}"><label>القسم</label><select class="inp" id="f2">${cats.slice(1).map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select>
<div class="two"><div><label>السعر ($)</label><input class="inp" id="f3" type="number" value="${p.price}"></div><div><label>الكمية</label><input class="inp" id="f4" type="number" value="${p.stock}"></div></div>
<label>المقاسات (مفصولة بفاصلة)</label><input class="inp" id="f5" value="${esc(p.sizes)}" dir="ltr">
<label>صور المنتج (اختر عدة صور دفعة واحدة — الأولى هي الصورة الرئيسية)</label><div class="ths" id="ths">${thsHTML()}</div><input type="file" accept="image/*" multiple class="inp" onchange="upImgs(this)">
<div class="two"><div><label>رمز بديل (يظهر عند عدم وجود صور)</label><input class="inp" id="f6" value="${esc(p.emoji)}"></div><div><label>لون الخلفية</label><input class="inp" id="f7" type="color" value="${esc(p.color)}" style="height:40px;padding:2px"></div></div>
<label><input type="checkbox" id="f8" ${p.on?'checked':''}> ظاهر في المتجر</label>
<div class="two" style="margin-top:12px"><button class="btn" onclick="saveP()">حفظ</button><button class="btn o" onclick="edit=null;keep()">إلغاء</button></div>
${p.id?`<button class="btn r w" style="margin-top:10px" onclick="delP()">حذف المنتج</button>`:''}</div></div>`}
const thsHTML=()=>{const L=edit.imgs||[];return L.length?L.map((u,i)=>`<div class="th"><img src="${u}" alt=""><button class="x" onclick="delImg(${i})" aria-label="حذف">✕</button>${i?`<button class="m" onclick="mainImg(${i})" aria-label="جعلها رئيسية">★</button>`:'<span class="mn">رئيسية</span>'}</div>`).join(''):'<div class="nth">لا توجد صور — سيظهر الرمز البديل</div>'};
const comp=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)});
async function upImgs(el){const fs=[...el.files];if(!fs.length)return;edit.imgs=edit.imgs||[];const room=MAXI-edit.imgs.length;if(room<=0){toast('الحد الأقصى '+MAXI+' صور لكل منتج');el.value='';return}
let n=0;for(const f of fs.slice(0,room)){try{edit.imgs.push(await comp(f));n++}catch(e){}}
toast(fs.length>room?'أُضيفت '+n+' فقط (الحد الأقصى '+MAXI+')':'تمت إضافة '+n+' صورة');el.value='';$('ths').innerHTML=thsHTML()}
function delImg(i){edit.imgs.splice(i,1);$('ths').innerHTML=thsHTML()}
function mainImg(i){edit.imgs.unshift(edit.imgs.splice(i,1)[0]);$('ths').innerHTML=thsHTML()}
function saveP(){const p={...edit,name:$('f1').value.trim(),cat:$('f2').value,price:+$('f3').value||0,stock:+$('f4').value||0,sizes:$('f5').value.replace(/\s/g,'')||'واحد',emoji:$('f6').value||'👕',color:$('f7').value,on:$('f8').checked,imgs:edit.imgs||[]};
if(!p.name){toast('اكتب اسم المنتج');return}
if(p.id){D.products=D.products.map(x=>x.id===p.id?p:x)}else{p.id=Date.now();D.products.push(p)}
const ok=save();edit=null;if(ok)toast('تم حفظ المنتج');keep()}
function delP(){if(confirm('حذف هذا المنتج؟')){D.products=D.products.filter(x=>x.id!==edit.id);save();edit=null;keep()}}
const render=()=>{$('app').innerHTML=adminView();window.scrollTo?.(0,0)};
const keep=()=>{const y=scrollY;$('app').innerHTML=adminView();scrollTo(0,y)};
window.addEventListener('storage',e=>{if(e.key!==K||!e.newValue)return;const n0=D.orders.length;try{D=JSON.parse(e.newValue)}catch(x){return}D.customers=D.customers||[];if(D.orders.length>n0)toast('وصل طلب جديد 🛎️');if(!edit&&authed)keep()});
render();

/* ---------- فروع ---------- */
function addBr(){readS();D.settings.branches=D.settings.branches||[];D.settings.branches.push({n:'',p:''});save();keep()}
function delBr(i){if(!confirm('حذف هذا الفرع؟'))return;readS();D.settings.branches.splice(i,1);save();keep()}
/* ---------- حذف الطلبات ---------- */
function delOrder(id){if(!confirm('حذف هذا الطلب نهائيًا؟\nيُنصح بتصدير الطلبات إلى Excel أولًا.'))return;D.orders=D.orders.filter(o=>o.id!==id);save();toast('تم حذف الطلب');keep()}
function delOrders(){const L=D.orders.filter(o=>ofl==='الكل'||o.st===ofl);if(!L.length)return;
 if(!confirm('سيتم حذف '+L.length+' طلب ('+ofl+') نهائيًا.\nهل صدّرت نسخة Excel؟ متابعة الحذف؟'))return;
 if(ofl==='الكل'&&!confirm('تأكيد أخير: حذف جميع الطلبات؟'))return;
 const ids=new Set(L.map(o=>o.id));D.orders=D.orders.filter(o=>!ids.has(o.id));save();toast('تم حذف '+L.length+' طلب');keep()}
/* ---------- نسخة احتياطية ---------- */
function backup(){saveBlob('MND-backup-'+dstr()+'.json',new Blob([JSON.stringify(D)],{type:'application/json'}))}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let x;try{x=JSON.parse(r.result);if(!x.products||!x.settings||!Array.isArray(x.orders))throw 0}catch(e){toast('ملف النسخة غير صالح');return}
 if(!confirm('سيتم استبدال جميع البيانات الحالية بالنسخة المختارة. متابعة؟'))return;D=x;if(save())location.reload()};r.readAsText(f)}

function crc32(u){const t=crc32.t||(crc32.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0}));let r=-1;for(let i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}

const xe=v=>String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

 {n:'xl/_rels/workbook.xml.rels',d:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${RN}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="${RN}/styles" Target="styles.xml"/></Relationships>`},
